<body class="bg-background min-h-screen flex items-center justify-center p-4 antialiased text-on-surface">
<main class="w-full max-w-md">
<!-- Logo -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-title-md font-bold text-primary inline-flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="monitoring">monitoring</span>
                PriceNaija
            </h1>
</div>
<!-- Signup Card -->
<div class="bg-surface-white border border-border-subtle rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-8">
<div class="mb-8 text-center">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">
                    Create your developer account
                </h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Get your free API key and start building with Nigerian food-price data.
                </p>
</div>
<form class="space-y-6">
<!-- Name Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-1" for="name">Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="person">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-border-subtle rounded-lg bg-surface-white text-on-surface font-body-sm text-body-sm focus:outline-none input-glow transition-all" id="name" name="name" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-1" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-border-subtle rounded-lg bg-surface-white text-on-surface font-body-sm text-body-sm focus:outline-none input-glow transition-all" id="email" name="email" placeholder="developer@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-border-subtle rounded-lg bg-surface-white text-on-surface font-body-sm text-body-sm focus:outline-none input-glow transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-1" for="confirm-password">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="lock_reset">lock_reset</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-border-subtle rounded-lg bg-surface-white text-on-surface font-body-sm text-body-sm focus:outline-none input-glow transition-all" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-body-sm font-body-sm font-medium text-on-primary bg-primary-container hover:bg-tertiary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                    Create Account
                </button>
</form>
<div class="mt-6 text-center">
<a class="font-body-sm text-body-sm text-primary hover:text-tertiary-container transition-colors" href="/login">
                    Already have an account? Sign in
                </a>
</div>
</div>
<!-- Optional Decorative Image underneath -->
<div class="mt-12 opacity-50 flex justify-center pointer-events-none">
<div class="bg-cover bg-center w-64 h-32 opacity-20 grayscale" data-alt="A highly abstract, modern technical illustration depicting streams of digital data flowing through a network of nodes, rendered in crisp whites, subtle grays, and vivid emerald green accents. The lighting is soft and diffuse, creating a clean, high-tech, light-mode aesthetic suitable for a professional data intelligence platform." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCeN1hHYcs55i5ga25ccxmT0AHvCjdVqW1izpSYDZCb-Y6RRP_MknIUmgfLA4l8e6BdLPWhJRwNZsOOC7dqFX4Sjudk2q82Peao4OyFP0IMg_BcK_ya41yqX1zz-gu4fyhRSBIZca6Uq0RiELQZsyTmyB1SSmkgdvsHhQ0kU5cKg_Fr64zga3uOgBtIxRNY4gqhQTKKffgUIs6gZYt6XMzkrS9I9QifiS2C7TBCmSDpUL5nBN35lkjZ')"></div>
