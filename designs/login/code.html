<body class="bg-background h-full flex flex-col justify-center items-center px-margin-mobile sm:px-margin-desktop selection:bg-primary selection:text-on-primary">
<div class="w-full max-w-md bg-surface-container-lowest border border-border-subtle rounded-xl p-8 shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-title-md text-primary mb-2 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-3xl" data-icon="monitoring" data-weight="fill" style="font-variation-settings: 'FILL' 1;">monitoring</span>
                PriceNaija
            </h1>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Welcome back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to your developer account.</p>
</div>
<!-- Form -->
<form class="space-y-6">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="email">Email address</label>
<input class="w-full px-4 py-2 bg-surface-white border border-border-subtle rounded-lg font-body-sm text-body-sm text-on-surface focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-colors outline-none" id="email" name="email" placeholder="developer@example.com" required="" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-2 bg-surface-white border border-border-subtle rounded-lg font-body-sm text-body-sm text-on-surface focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-colors outline-none pr-10" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-primary-container hover:bg-tertiary-container text-on-primary font-body-sm text-body-sm font-semibold py-3 px-4 rounded-lg transition-colors" type="submit">
                Sign In
            </button>
</form>
<!-- Footer -->
<div class="mt-8 text-center space-y-4">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? <a class="text-primary hover:text-primary-container font-medium transition-colors" href="/signup">Create one</a>
</p>
<div class="pt-6 border-t border-border-subtle flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="code">code</span>
<span class="font-label-caps text-label-caps">Build with Nigerian food-price data</span>
</div>
</div>
</div>
</body></html>
